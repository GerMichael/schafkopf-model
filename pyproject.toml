[project]
name = "schafskopf"
version = "0.1.0"
description = "Text-based Schafkopf card game with reinforcement-learning AI opponents"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.3",
    "torch>=2.9",
]

[project.scripts]
schafskopf = "schafskopf.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schafskopf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
